name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the superseded run. Pushes to `main` and manual runs
# get a group of their own: each one must finish, because a skipped run is a commit nobody checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that needs no browser: the steps of `pnpm ci:verify` (see package.json), split so a
  # failure is easy to locate, plus the docs-sync check and a dry run of the deployment.
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm check:docs
      # Fonts and engines are not committed; some unit tests read public/fonts, so fetch before unit.
      - run: pnpm fetch:engines --sync
      - run: pnpm unit
      - run: pnpm audit:model-types
      - run: pnpm build
      - run: pnpm verify:assets
      - run: pnpm check:licenses
      - run: pnpm assemble:dist
      # Validates wrangler.jsonc and bundles dist/ exactly as the deploy job will, without credentials.
      - run: npx --yes wrangler@4.135.0 deploy --dry-run

  # The Playwright suite in four shards. Each shard builds its own dist/ (`playwright.config.ts`
  # starts `pnpm preview` only when dist/editor/index.html exists) and runs a quarter of the tests.
  # The service-worker project is left to its own job below.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser download is cached on the installed Playwright version; the system libraries
      # it needs are apt packages and are not part of that cache, so a hit still installs them.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm fetch:engines --sync
      - run: pnpm build
      - run: pnpm assemble:dist

      - run: pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/4

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The service-worker tests run alone and after the chromium project: installing and updating the
  # worker is timing-sensitive beside four busy workers (see `playwright.config.ts`).
  e2e-service-worker:
    name: e2e-service-worker
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm fetch:engines --sync
      - run: pnpm build
      - run: pnpm assemble:dist

      # --no-deps: the chromium project it depends on has just run, in the shards above.
      - run: pnpm exec playwright test --project=service-worker --no-deps

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-service-worker
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # `pnpm ci:behavior` (see package.json): the phase 3 and 4 harnesses drive the assembled dist/
  # in Chromium through `tools/preview-dist.mjs`; the signing check runs under `tsx` and calls the
  # `openssl` binary, which ubuntu-latest ships.
  behavior:
    name: behavior
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm fetch:engines --sync
      - run: pnpm build
      - run: pnpm assemble:dist
      - run: openssl version
      - run: pnpm ci:behavior

  # PDF → Word export fidelity (`e2e/fidelity/`): every sample is exported through the real UI, the
  # DOCX is converted back to PDF by a pinned LibreOffice, and the pages and words are compared with
  # the original. Thresholds live in `e2e/fidelity/thresholds.json`; a `null` there means "measured,
  # not gated", so until a mode has numbers this job reports and does not fail on quality. It is a
  # quality gate: `deploy` needs it. The report is appended to the job summary and uploaded either way.
  #
  # LibreOffice comes from the official .deb tarball, verified by sha256 on every run (a cached
  # copy is verified too). It is fetched from the Document Foundation's permanent archive
  # (`downloadarchive.documentfoundation.org/libreoffice/old/<full version>/`), which keeps every
  # release, so a cache miss still finds it. Upgrading means changing the version, the cache key
  # and the hash together.
  fidelity:
    name: fidelity
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      E2E_WORKERS: 2
      LIBREOFFICE_VERSION: 26.2.6
      LIBREOFFICE_BUILD: 26.2.6.3
      LIBREOFFICE_SHA256: fd0e8f8f2408dd2e5b90286e60f3f97cf566ba441cd48cfc5bcc68067303e0bc
      LIBREOFFICE: /opt/libreoffice26.2/program/soffice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/libreoffice-cache
          key: libreoffice-26.2.6-deb-x86_64

      # `apt-get install ./*.deb` rather than `dpkg -i`: it installs the local packages and pulls in
      # whatever system libraries they depend on. The desktop-integration packages are left out.
      - name: Install LibreOffice ${{ env.LIBREOFFICE_VERSION }}
        run: |
          set -euo pipefail
          archive="$HOME/libreoffice-cache/LibreOffice_${LIBREOFFICE_VERSION}_Linux_x86-64_deb.tar.gz"
          mkdir -p "$HOME/libreoffice-cache"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --output "$archive" \
              "https://downloadarchive.documentfoundation.org/libreoffice/old/${LIBREOFFICE_BUILD}/deb/x86_64/LibreOffice_${LIBREOFFICE_BUILD}_Linux_x86-64_deb.tar.gz"
          fi
          echo "${LIBREOFFICE_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          debs=$(find "$RUNNER_TEMP"/LibreOffice_*_deb/DEBS -name '*.deb' ! -name '*integration*' ! -name '*debian-menus*')
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $debs
          "$LIBREOFFICE" --version

      - run: pnpm fetch:engines --sync
      - run: pnpm build
      - run: pnpm assemble:dist

      # The public samples (`e2e/fidelity/corpus.json`) are downloaded once and checked by sha256
      # on every run, cached or not; the key follows the manifest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/fidelity-corpus
          key: fidelity-corpus-${{ hashFiles('e2e/fidelity/corpus.json') }}

      - run: pnpm fidelity

      # `if: always()` on both: a failing gate is exactly when the numbers are wanted.
      - name: Add the report to the job summary
        if: always()
        run: |
          if [ -f test-results/fidelity/report.md ]; then
            cat test-results/fidelity/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No fidelity report was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the fidelity results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fidelity
          path: test-results/fidelity/
          if-no-files-found: ignore
          retention-days: 14

  # Only a push to `main` deploys, and only once every check above passed. Deploys run one at a time
  # and are never cancelled half way; a run whose commit is no longer main's head deploys nothing, so
  # an older push whose checks finished late cannot replace a newer build. The job needs nothing beyond the read-only token of the
  # workflow: the Cloudflare credentials are repository secrets, passed only to the wrangler steps.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e, e2e-service-worker, behavior, fidelity]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://pdf.isolmaz.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The newest push to main is the one that deploys. A newer push queues its own deploy behind
      # this one (same concurrency group), so checking here is enough.
      - name: Check this commit is still main's head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          head=$(git ls-remote "https://github.com/$REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on to ${head:-an unknown commit}; $GITHUB_SHA is not deployed"
          fi

      - if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.head.outputs.current == 'true'
        run: pnpm fetch:engines --sync
      - if: steps.head.outputs.current == 'true'
        run: pnpm build
      - if: steps.head.outputs.current == 'true'
        run: pnpm assemble:dist

      # `wrangler deployments list --json` is sorted oldest first, so the last entry is the live
      # one; the version taking most of its traffic is what a rollback returns to. An empty answer
      # (a Worker that was never deployed) leaves nothing to roll back to, and the rollback step says so.
      - name: Record the version being replaced
        id: previous
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          previous=""
          if json=$(npx --yes wrangler@4.135.0 deployments list --json); then
            previous=$(printf '%s' "$json" | node -e '
              let text = "";
              process.stdin.on("data", (chunk) => { text += chunk; }).on("end", () => {
                const live = JSON.parse(text).at(-1);
                const top = [...(live?.versions ?? [])].sort((a, b) => b.percentage - a.percentage)[0];
                process.stdout.write(top?.version_id ?? "");
              });
            ')
          else
            echo "::warning::could not list the current deployments; a failed smoke check cannot be rolled back"
          fi
          echo "Version being replaced: ${previous:-none}"
          echo "version=$previous" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.135.0 deploy

      # The check caps itself at about eight minutes; the step timeout makes a hang a failure the
      # rollback below reacts to, rather than a cancelled job that leaves the new build live.
      - name: Smoke check the live site
        id: smoke
        if: steps.deploy.outcome == 'success'
        timeout-minutes: 12
        run: node tools/deploy/smoke.mjs https://pdf.isolmaz.com

      # `--yes` keeps the rollback from prompting. The smoke step has already failed the job; this
      # step puts the previous version back. It also runs when the job is cancelled after the deploy.
      - name: Roll back to the previous version
        if: (failure() || cancelled()) && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "::error::the smoke check failed and no previous version was recorded; roll back by hand"
            exit 1
          fi
          npx --yes wrangler@4.135.0 rollback "$PREVIOUS_VERSION" --yes --message "Automatic rollback: smoke check failed for ${GITHUB_SHA}"
          echo "::error::the smoke check failed; rolled back to version $PREVIOUS_VERSION"
