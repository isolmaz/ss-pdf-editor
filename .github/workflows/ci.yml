name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The one place the wrangler version is written for this workflow. `wrangler` is not a dependency of
# the repository (it would pull in a library under a licence the project does not accept), so it is
# run with `pnpm dlx`; the `worker:deploy*` scripts of package.json name the same version.
env:
  WRANGLER_VERSION: 4.135.0

# A new push to a pull request cancels the superseded run. Pushes to `main` and manual runs
# get a group of their own: each one must finish, because a skipped run is a commit nobody checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that needs no browser: the steps of `pnpm ci:verify` (see package.json), split so a
  # failure is easy to locate, plus a dry run of the deployment. It is also the only job that builds
  # the production site: it uploads the assembled `dist/` as the `dist` artifact, the browser jobs
  # serve exactly those files and `deploy` publishes exactly those files.
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm check:docs
      # Fonts and engines are not committed; some unit tests read public/fonts, so fetch before unit.
      - run: pnpm fetch:engines --sync
      - run: pnpm unit
      - run: pnpm audit:model-types
      - run: pnpm build
      - run: pnpm check:budgets
      - run: pnpm verify:assets
      - run: pnpm check:licenses
      - run: pnpm assemble:dist
      # The hygiene rules of the git hooks, for a pull request from a fork and a commit made with
      # --no-verify.
      - run: node tools/hooks/guard.mjs tracked
      # Validates wrangler.jsonc and bundles dist/ exactly as the deploy job will, without credentials.
      - run: pnpm dlx "wrangler@$WRANGLER_VERSION" deploy --dry-run

      # The one production build of the run: no job below builds it again, so the bytes the browser
      # jobs test are the bytes `deploy` uploads. `download-artifact` fails a download whose digest
      # differs from the one recorded here. (`coverage-e2e` and `coverage` build the unminified
      # editor themselves: they need its source maps, and that build never leaves its job.)
      - name: Upload the assembled dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The Playwright suite in four shards. Each shard downloads the `dist/` that `verify` built
  # (`playwright.config.ts` starts `pnpm preview` only when dist/editor/index.html exists) and runs
  # a quarter of the tests. The service-worker project is left to its own job below.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser download is cached on the installed Playwright version; the system libraries
      # it needs are apt packages and are not part of that cache, so a hit still installs them.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Fonts and engines are not committed; the specs' fixtures read them from `public/`.
      - run: pnpm fetch:engines --sync

      # The site as `verify` built and checked it: `playwright.config.ts` serves it from `dist/`.
      - name: Download the assembled dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - run: pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/4

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The service-worker tests run alone and after the chromium project: installing and updating the
  # worker is timing-sensitive beside four busy workers (see `playwright.config.ts`).
  e2e-service-worker:
    name: e2e-service-worker
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Fonts and engines are not committed; the specs' fixtures read them from `public/`.
      - run: pnpm fetch:engines --sync

      # The site as `verify` built and checked it: `playwright.config.ts` serves it from `dist/`.
      - name: Download the assembled dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # --no-deps: the chromium project it depends on has just run, in the shards above.
      - run: pnpm exec playwright test --project=service-worker --no-deps

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-service-worker
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # `pnpm ci:behavior` (see package.json): the editor-flow and text-edit harnesses drive the assembled dist/
  # in Chromium through `tools/preview-dist.mjs`; the signing check runs under `tsx` and calls the
  # `openssl` binary, which ubuntu-latest ships.
  behavior:
    name: behavior
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Fonts and engines are not committed; the specs' fixtures read them from `public/`.
      - run: pnpm fetch:engines --sync

      # The site as `verify` built and checked it: `playwright.config.ts` serves it from `dist/`.
      - name: Download the assembled dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - run: openssl version
      - run: pnpm ci:behavior

  # Unit + browser coverage of the project's own sources, in three kinds of job so that no runner
  # holds the whole browser run: `coverage-unit`, `coverage-e2e` in four shards, and the `coverage`
  # gate that merges what they leave; every total must be 100 %. `coverage-unit` runs the unit suite
  # under V8 coverage and nothing else.
  coverage-unit:
    name: coverage-unit
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fonts and engines are not committed; the unit tests need them.
      - run: pnpm fetch:engines --sync
      - run: pnpm coverage --unit-only

      - name: Upload the unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-unit
          path: coverage/unit/coverage-final.json
          retention-days: 1

  # Browser coverage in four shards of the chromium project (the last also runs the service-worker
  # tests): each shard builds the unminified editor, runs its quarter of the suite with every page
  # writing its V8 coverage to its own file, and uploads the files.
  coverage-e2e:
    name: coverage-e2e (${{ matrix.shard }}/4)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser download is cached on the installed Playwright version; the system libraries
      # it needs are apt packages and are not part of that cache, so a hit still installs them.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Fonts and engines are not committed; the build needs them.
      - run: pnpm fetch:engines --sync
      - run: pnpm coverage --e2e-shard=${{ matrix.shard }}/4

      # The records are gzipped already.
      - name: Upload the browser coverage records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-e2e-${{ matrix.shard }}
          path: coverage/e2e-v8/
          compression-level: 0
          retention-days: 1

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-e2e-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The gate: the unit coverage and every shard's records, merged and mapped to the sources by
  # `pnpm coverage --merge`, which builds the unminified editor again for its source maps (the build
  # is deterministic). It exits 1 under the floor, after the report is written.
  coverage:
    name: coverage
    needs: [coverage-unit, coverage-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fonts and engines are not committed; the build needs them.
      - run: pnpm fetch:engines --sync

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-part-*
          path: coverage-parts

      - run: pnpm coverage --merge=coverage-parts --min=100

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/report/
          if-no-files-found: ignore
          retention-days: 14

  # Only a push to `main` deploys, and only once every check above passed. What it deploys is the
  # `dist` artifact `verify` uploaded, the very files the browser jobs tested; it builds nothing.
  # Deploys run one at a time and are never cancelled half way; a run whose commit is no longer
  # main's head deploys nothing, so an older push whose checks finished late cannot replace a newer
  # build. The job needs nothing beyond the read-only token of the workflow: the Cloudflare
  # credentials are repository secrets, passed only to the wrangler steps. This is the only way the
  # site is deployed: the Workers Builds auto-deploy of the Cloudflare dashboard must stay off
  # (CONTRIBUTING.md, "Continuous integration").
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e, e2e-service-worker, behavior, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://pdf.isolmaz.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The newest push to main is the one that deploys. A newer push queues its own deploy behind
      # this one (same concurrency group), so checking here is enough.
      #
      # The shell is strict: when `git ls-remote` fails (a network error, a rate limit) or names no
      # head, the step and the job are red. Only a head that was read and differs from this commit
      # skips the deploy.
      - name: Check this commit is still main's head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote=$(git ls-remote "https://github.com/$REPOSITORY" refs/heads/main)
          head=${remote%%[[:space:]]*}
          if [ -z "$head" ]; then
            echo "::error::could not read the head of main from https://github.com/$REPOSITORY"
            exit 1
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on to $head; $GITHUB_SHA is not deployed"
          fi

      # Nothing is built here: the `dist/` that `verify` assembled, and every browser job tested, is
      # downloaded and deployed as it is. Nothing is installed either: `wrangler` runs
      # through `pnpm dlx` and the smoke check uses Node built-ins only.
      - name: Download the assembled dist/
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # `wrangler deployments list --json` is sorted oldest first, so the last entry is the live
      # one; the version taking most of its traffic is what a rollback returns to. An empty answer
      # (a Worker that was never deployed) leaves nothing to roll back to, and the rollback step says so.
      - name: Record the version being replaced
        id: previous
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          previous=""
          if json=$(pnpm dlx "wrangler@$WRANGLER_VERSION" deployments list --json); then
            previous=$(printf '%s' "$json" | node -e '
              let text = "";
              process.stdin.on("data", (chunk) => { text += chunk; }).on("end", () => {
                const live = JSON.parse(text).at(-1);
                const top = [...(live?.versions ?? [])].sort((a, b) => b.percentage - a.percentage)[0];
                process.stdout.write(top?.version_id ?? "");
              });
            ')
          else
            echo "::warning::could not list the current deployments; a failed smoke check cannot be rolled back"
          fi
          echo "Version being replaced: ${previous:-none}"
          echo "version=$previous" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx "wrangler@$WRANGLER_VERSION" deploy

      # The check caps itself at about eight minutes; the step timeout makes a hang a failure the
      # rollback below reacts to, rather than a cancelled job that leaves the new build live.
      - name: Smoke check the live site
        id: smoke
        if: steps.deploy.outcome == 'success'
        timeout-minutes: 12
        run: node tools/deploy/smoke.mjs https://pdf.isolmaz.com

      # `--yes` keeps the rollback from prompting. The smoke step has already failed the job; this
      # step puts the previous version back. It also runs when the job is cancelled after the deploy.
      - name: Roll back to the previous version
        if: (failure() || cancelled()) && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "::error::the smoke check failed and no previous version was recorded; roll back by hand"
            exit 1
          fi
          pnpm dlx "wrangler@$WRANGLER_VERSION" rollback "$PREVIOUS_VERSION" --yes --message "Automatic rollback: smoke check failed for ${GITHUB_SHA}"
          echo "::error::the smoke check failed; rolled back to version $PREVIOUS_VERSION"
