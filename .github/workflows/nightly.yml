name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Unit + browser coverage of the project's own sources, in three kinds of job so that no runner
  # holds the whole browser run: `coverage-unit`, `coverage-e2e` in four shards, and the `coverage`
  # gate that merges what they leave; every total must be 100 %. `coverage-unit` runs the unit suite
  # under V8 coverage and nothing else.
  coverage-unit:
    name: coverage-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fonts and engines are not committed; the unit tests need them.
      - run: pnpm fetch:engines --sync
      - run: pnpm coverage --unit-only

      - name: Upload the unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-unit
          path: coverage/unit/coverage-final.json
          retention-days: 1

  # Browser coverage in four shards of the chromium project (the last also runs the service-worker
  # tests): each shard builds the unminified editor, runs its quarter of the suite with every page
  # writing its V8 coverage to its own file, and uploads the files.
  coverage-e2e:
    name: coverage-e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser download is cached on the installed Playwright version; the system libraries
      # it needs are apt packages and are not part of that cache, so a hit still installs them.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Fonts and engines are not committed; the build needs them.
      - run: pnpm fetch:engines --sync
      - run: pnpm coverage --e2e-shard=${{ matrix.shard }}/4

      # The records are gzipped already.
      - name: Upload the browser coverage records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-e2e-${{ matrix.shard }}
          path: coverage/e2e-v8/
          compression-level: 0
          retention-days: 1

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-e2e-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The gate: the unit coverage and every shard's records, merged and mapped to the sources by
  # `pnpm coverage --merge`, which builds the unminified editor again for its source maps (the build
  # is deterministic). It exits 1 under the floor, after the report is written.
  coverage:
    name: coverage
    needs: [coverage-unit, coverage-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fonts and engines are not committed; the build needs them.
      - run: pnpm fetch:engines --sync

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-part-*
          path: coverage-parts

      - run: pnpm coverage --merge=coverage-parts --min=100

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/report/
          if-no-files-found: ignore
          retention-days: 14

  # The chromium project twice over, in the same four shards as CI, with no retries: a test that
  # passes on one run and fails on the other fails the job.
  flaky:
    name: flaky (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm fetch:engines --sync
      - run: pnpm build
      - run: pnpm assemble:dist

      - run: >-
          pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/4
          --repeat-each=2 --retries=0 --fail-on-flaky-tests

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
