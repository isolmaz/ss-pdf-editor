name: Revert proof

# For every fix in tools/review/revert-proof.json, the fix's own test must fail on the fix commit's
# parent (on an assertion) and pass on the fix commit. Slow: each entry checks out two commits and
# the browser ones build `dist/` twice. It runs on demand, and on a pull request labelled
# `revert-proof` (see REVIEW.md).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: revert-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revert-proof:
    name: revert-proof (${{ matrix.shard }}/6)
    if: contains(github.event.pull_request.labels.*.name, 'revert-proof') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      E2E_WORKERS: 2
    steps:
      # The script checks out the fix commits and their parents, so it needs the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser download is cached on the installed Playwright version; the system libraries
      # it needs are apt packages and are not part of that cache, so a hit still installs them.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Some unit tests read the fetched fonts; the script fetches again for the browser entries.
      - run: pnpm fetch:engines --sync

      - run: node tools/review/revert-proof.mjs --shard ${{ matrix.shard }}/6

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: revert-proof-${{ matrix.shard }}
          path: revert-proof-report.json
          if-no-files-found: ignore
          retention-days: 14
