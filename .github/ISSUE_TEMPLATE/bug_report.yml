name: Bug report
description: Something in the editor or the site does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here — see SECURITY.md. Please do not attach
        documents that contain personal or confidential data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a two-page PDF
        2. Rotate page 2
        3. Export
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The live site, or the commit you built from.
  - type: textarea
    id: document
    attributes:
      label: About the document
      description: Page count, size, whether it is scanned, signed, encrypted or has forms. Attach it only if it is safe to share.
