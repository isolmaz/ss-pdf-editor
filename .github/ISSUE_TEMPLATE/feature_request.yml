name: Feature request
description: Suggest a capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How should the editor behave? Note that documents never leave the device, so a feature that needs a server is out of scope.
    validations:
      required: true
